# Learned critic for SPEC.md §5's D slot (CLAUDE.md's "Q as critic"). See cfe/search/critic.py.
#
# This is an ADDITIVE alternative objective, screened against already-replayed outcomes before
# being trained here as a deployment checkpoint and tried in a real search+replay run
# (scripts/diagnose_critic_search.py). `critic-screen-v1` (PROGRESS.md 2026-08-10) measured
# grouped leave-one-episode-out pairwise accuracy 0.711 for this exact recipe, against the
# goal-distance objective's established 0.6211-0.6731 (single model) / 0.6680 (3-seed ensemble).
#
# NOT a registered configs/search.yaml experiment: promoting this into stage 2 is a SPEC.md §5
# change and is the user's call (CLAUDE.md), independent of what any run here shows.

encoder_config: configs/encoder.yaml
env_config: configs/env.yaml
dynamics_config: configs/dynamics.yaml

# Which trained dynamics model rolls candidates to z_end. The model of record, so every number
# this critic ever touches is comparable to every other search result in this project.
dyn_run: p2-dyn-res

data:
  # Every already-replayed bank this checkpoint trains on. K=8 only -- cfe/search/critic.py's
  # docstring explains why mixing budgets would muddy the comparison to the established
  # ranking-accuracy baselines, which were measured at K=8.
  banks: [p3-bank-replay, p3-oracle56-replay, p35-probe-window-replay]

critic:
  # 0 = plain logistic regression. `critic-screen-v1` cleared the ranking-accuracy screen
  # already at this setting; there is no evidence yet that a hidden layer is needed, and adding
  # one before that evidence exists would be exactly the complexity CLAUDE.md's "boring,
  # readable implementations" asks to avoid.
  hidden: 0
  epochs: 300
  lr: 0.01
  weight_decay: 0.001

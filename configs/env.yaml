# Environment config for the G0 gate (SPEC.md §7).
# libero_object is adopted first per SPEC.md §2.
suite: libero_object
task_id: 0

# 128x128 keeps the gate fast. Encoder resolution is a Phase 1 concern, set in encoder.yaml.
camera_height: 128
camera_width: 128

# Offscreen GL backend for MuJoCo. "egl" or "osmesa".
render_backend: egl

seed: 0

# Demo HDF5s live outside the repo (large, and the repo is on a slow 9p mount).
dataset_dir: ~/data/libero

# Number of init states compared in the I1 exact-reset check, and the number of
# steps the post-reset determinism check rolls out.
i1_num_init_states: 3
i1_rollout_steps: 10

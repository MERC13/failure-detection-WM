# Action-conditioned latent dynamics (SPEC.md §4.2).
#
# G2's central question is whether this model beats an identical one trained with actions
# zeroed. The pass criteria in `gate:` below were fixed BEFORE any number existed, which is the
# whole point of writing them down — relaxing a threshold after seeing the result is what
# CLAUDE.md rule 3 forbids, and "it was only a little short" is how that happens.

encoder_config: configs/encoder.yaml # which cache to read; must already be populated
env_config: configs/env.yaml

dynamics:
  # SPEC.md §4.2: "k = 4, H = 8 to start. Both configurable."
  k_context: 4
  horizon: 8

  # Which reduction of the 257x768 patch tokens the model works on. Chosen by measurement
  # (scripts/probe_representation.py), not preference: `full` is ~13 GB of latents for this
  # dataset and does not fit, and `mean` throws away *where* the object is, which is most of
  # what separates success from failure here. See PROGRESS.md for the measured rho per option.
  reduction: grid4

  d_model: 384
  n_layers: 4
  n_heads: 6
  dropout: 0.1
  ffn_mult: 4
  latent_dim: 768 # DINOv2-base token width

  # Predict `z[t+1..t+H]` as a delta off `z[t]` instead of synthesising the whole latent.
  #
  # ON, because it is the only configuration that passes G2. Reverted to `false` on 2026-08-04
  # and restored the same day when the amended gate was actually run; the reversal is recorded
  # rather than quietly rewritten, because the reasoning behind it was wrong in an instructive
  # way.
  #
  #   run          beats_copy_last   beats_action_ignoring @h96   G2
  #   p2-dyn       FAIL              0.2678 PASS                  4/5 FAIL
  #   p2-dyn-res   PASS              0.2238 PASS                  5/5 PASS
  #
  # `beats_copy_last_latent` never moved and `p2-dyn` had been failing it since 2026-08-01, so
  # on unchanged criteria the standings were always p2-dyn 3/5 vs p2-dyn-res 4/5. The revert
  # argued that action-sensitivity matters more than the gate says it does -- substituting
  # judgement for the gate, which is not a call to make unilaterally.
  #
  # What stays true from the revert, and should be carried into Phase 3: residual IS less
  # action-sensitive (0.2238 vs 0.2678 at h96, worse at every horizon), and it converges ~3%
  # worse on val loss with an inverted train-val gap that shows it underfitting. It clears 0.20
  # by 12% where plain clears it by 34%. If the search turns out to be starved of action signal,
  # this flag is the first thing to revisit -- and `p2-dyn` is already trained and on disk.
  #
  # Also refuted: the original claim that residual is "not merely faster convergence" because it
  # was worth +14.5% at 2400 steps. At full scale the head start is gone by epoch 5. The
  # 64-window overfit batch that diagnostic ran on was too small for the lost capacity to show.
  residual: true

train:
  epochs: 30
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.0001
  val_fraction: 0.15 # held out by EPISODE; windows overlap heavily, so a window split leaks
  grad_clip: 1.0

  # SPEC.md §4.2: "teacher-forced one-step loss plus a short autoregressive rollout loss
  # (2 steps)". Read as chunk-level: chunk 1 from real context, chunk 2 from the model's own
  # predictions. See cfe/dynamics/model.py:rollout_loss for why.
  ar_chunks: 2
  loss: smooth_l1

eval:
  # Gated horizons, per SPEC.md §4.2.
  horizons: [1, 2, 4, 8]

  # NOT gated. SPEC.md §5 rolls the model forward from the edit window to the end of the
  # episode, which is far past horizon 8, and nothing in G2 as specified would reveal that the
  # error has exploded by then. Reported so Phase 3 is not a surprise.
  diagnostic_horizons: [16, 32, 64]

  n_bootstrap: 10000

gate:
  # Pre-registered 2026-07-31, before the model was trained. See CHANGELOG.md if these change.
  ci_horizons: [4, 8] # paired bootstrap CI must exclude zero at both
  min_abs_spearman: 0.30 # goal-latent distance vs task success

  # AMENDED 2026-08-04 by the user, on measurement. Was `min_rel_improvement_h8: 0.20`.
  #
  # **The threshold did not move.** 0.20 is still 0.20. What moved is the horizon it is measured
  # at, 8 -> 96, because h8 is not a regime this project ever operates in: SPEC.md §5's search
  # rolls from the edit window to episode end, 100+ steps. h8 measured action-conditioning where
  # it is weakest and the search runs where it is ~5x stronger.
  #
  # This is a gate change and it is logged in CHANGELOG.md with its reasoning and the three
  # rejected alternatives. It was brought to the user as a measurement and decided by them, not
  # amended unilaterally -- CLAUDE.md rule 3. The full basis:
  #   - the horizon effect is real, not episode selection (4.5-6.1x horizon vs 1.1-1.5x
  #     selection; the h8 row is flat across window sets differing 3.4x in size)
  #   - the model has a genuine smooth action gradient (quadratic edit response, detectable to
  #     0.05 std), so h8 weakness is a scale artifact rather than fine-edit blindness
  # Both measurements are in PROGRESS.md 2026-08-03/04 and reproducible via
  # scripts/diagnose_window_selection.py and scripts/diagnose_edit_discrimination.py.
  #
  # h96 is scored on the windows that can supply 96 future frames (1222 of 2542), which is a
  # smaller and longer-episode population than the CI criterion above uses. That is a real
  # narrowing and is reported in the gate output rather than hidden.
  min_rel_improvement: 0.20
  rel_improvement_horizon: 96
